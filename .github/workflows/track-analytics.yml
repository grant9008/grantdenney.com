name: Track analytics

# Pulls GA4 and Search Console numbers once a day into data/analytics.json, which
# the site reads. Needs a Google service account key in the repository secret
# GOOGLE_SERVICE_ACCOUNT. Without that secret the job exits cleanly and changes
# nothing, so this is safe to merge before the Google side is set up.
on:
  schedule:
    - cron: "41 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Skip if no credential is configured
        id: gate
        env:
          KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$KEY" ]; then
            echo "GOOGLE_SERVICE_ACCOUNT is not set; nothing to do."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.gate.outputs.ready == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        if: steps.gate.outputs.ready == 'true'
        run: pip install --quiet google-auth requests

      - name: Pull the numbers
        if: steps.gate.outputs.ready == 'true'
        env:
          GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
        run: python tools/pull-analytics.py

      - name: Commit if anything changed
        if: steps.gate.outputs.ready == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet data/analytics.json; then
            echo "no change today"
          else
            git add data/analytics.json
            git commit -m "Update analytics for $(date -u +%Y-%m-%d)"
            git push
          fi
