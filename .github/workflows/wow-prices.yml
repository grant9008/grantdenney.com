name: WoW Forever prices

# Blizzard's auction API shows what is listed right now and keeps no history,
# so this snapshots the Alliance auction house (PvP ruleset) and keeps the
# history itself. Output goes to the separate `wow-data` branch, which the
# Goblin Ledger price site (grantdenney.com/goblin-ledger/prices) reads
# through raw.githubusercontent.com. Keeping it off `main` means the updates
# never rebuild the site.
#
# Blizzard refreshes the data about once an hour. GitHub often drops or delays
# scheduled runs, so this checks 4 times an hour. A check where Blizzard has
# nothing new ends quickly and publishes nothing (the script says
# changed=false), so the extra runs are cheap. A download that looks
# incomplete is held back: only a note in state.json is published, so the
# next check downloads it again instead of publishing half the prices.
on:
  schedule:
    - cron: "4,19,34,49 * * * *"   # every 15 minutes, at :04, :19, :34 and :49
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wow-prices
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Until the Battle.net key is added as repo secrets there is nothing to
    # fetch, so the job reports "skipped" instead of failing every run.
    env:
      HAS_KEY: ${{ secrets.BNET_CLIENT_ID != '' && secrets.BNET_CLIENT_SECRET != '' }}
    steps:
      - name: Waiting for the Battle.net key
        if: env.HAS_KEY != 'true'
        run: echo "Add BNET_CLIENT_ID and BNET_CLIENT_SECRET under Settings > Secrets > Actions (see Setup-WoW-Key.bat)."

      - uses: actions/checkout@v4
        if: env.HAS_KEY == 'true'
        with:
          sparse-checkout: tools/wow

      - name: Get the existing price history
        if: env.HAS_KEY == 'true'
        run: |
          # Exit 0 = the branch exists, 2 = it really does not exist yet.
          # Anything else is a hiccup: stop rather than start the history over.
          set +e
          git ls-remote --exit-code --heads origin wow-data >/dev/null
          rc=$?
          set -e
          if [ "$rc" = 0 ]; then
            git clone --depth 1 --branch wow-data \
              "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" wowdata
          elif [ "$rc" = 2 ]; then
            mkdir wowdata && cd wowdata && git init -b wow-data
          else
            echo "Could not read the wow-data branch (git ls-remote exit $rc). Nothing published."
            exit 1
          fi

      - name: Snapshot the auction house
        id: snapshot
        if: env.HAS_KEY == 'true'
        env:
          BNET_CLIENT_ID: ${{ secrets.BNET_CLIENT_ID }}
          BNET_CLIENT_SECRET: ${{ secrets.BNET_CLIENT_SECRET }}
        run: python tools/wow/fetch_ah.py wowdata

      - name: Nothing new from Blizzard
        if: env.HAS_KEY == 'true' && steps.snapshot.outputs.changed != 'true'
        run: echo "Blizzard has not refreshed the auction house since the last snapshot, so nothing was published."

      - name: Publish (one commit, history kept in the files not in git)
        if: env.HAS_KEY == 'true' && steps.snapshot.outputs.changed == 'true'
        run: |
          cd wowdata
          # Only replace the snapshot this run started from: if the user's PC
          # (tools/wow/addon/collect_prices.ps1) published a newer one meanwhile,
          # the push is refused instead of rolling it back. Empty BASE = the
          # branch must not exist yet.
          BASE=$(git rev-parse -q --verify HEAD || true)
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan next
          git add -A
          git commit -q -m "WoW Forever prices $(date -u +%Y-%m-%dT%H:%MZ)"
          git push --force-with-lease=wow-data:$BASE \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" next:wow-data
